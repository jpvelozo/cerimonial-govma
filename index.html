    background-size:320px 320px;background-repeat:repeat;
    color:var(--texto);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
  }
  .faixa{
    width:100%;height:8px;
    background:linear-gradient(90deg,
      var(--vinho) 0 12.5%, var(--vermelho) 0 25%, var(--azul) 0 37.5%, var(--marinho) 0 50%,
      var(--verde) 0 62.5%, var(--verde-claro) 0 75%, var(--amarelo) 0 87.5%, var(--laranja) 0 100%);
  }
  main{width:100%;max-width:480px;padding:28px 16px 40px}

  .topo{
    background:var(--card);border-radius:20px;padding:28px 22px 22px;text-align:center;
    box-shadow:0 12px 34px rgba(15,25,90,.30);margin-bottom:20px;
  }
  .topo img{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
  .topo p{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--borda);
    font-size:13px;color:var(--suave);font-weight:500;
  }

  .links{display:flex;flex-direction:column;gap:12px}
  .link{
    --cor:var(--marinho);
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--borda);border-radius:14px;
    padding:15px 16px;text-decoration:none;color:var(--texto);
    font-weight:600;font-size:15px;border-left:5px solid var(--cor);
    box-shadow:0 6px 18px rgba(15,25,90,.22);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .link:nth-child(6n+1){--cor:var(--vermelho)}
  .link:nth-child(6n+2){--cor:var(--azul)}
  .link:nth-child(6n+3){--cor:var(--verde)}
  .link:nth-child(6n+4){--cor:var(--amarelo)}
  .link:nth-child(6n+5){--cor:var(--laranja)}
  .link:nth-child(6n+6){--cor:var(--marinho)}
  .link:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,25,90,.32)}
  .link:active{transform:scale(.98)}
  .icone{
    width:38px;height:38px;flex:0 0 38px;border-radius:10px;
    background:color-mix(in srgb,var(--cor) 14%,white);
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .rotulo{flex:1;line-height:1.3}
  .rotulo small{display:block;font-weight:500;font-size:12px;color:var(--suave);margin-top:2px}
  .seta{color:var(--cor);font-size:20px;font-weight:700}

  footer{margin:28px auto 0;width:fit-content;background:rgba(255,255,255,.94);padding:10px 22px;border-radius:999px;box-shadow:0 4px 14px rgba(15,25,90,.2);text-align:center;font-size:11px;color:var(--suave);font-weight:500;line-height:1.6}
  footer strong{color:var(--marinho)}
</style>
